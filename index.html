<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Propostas Comerciais - Suprimática</title>
  
  <!-- Estilos de Produção (Tailwind v4 + Custom CSS compilados) -->
  <link rel="stylesheet" href="/dist/styles.css?v=24.0">
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone para compilação instantânea sem cache preso -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="h-screen overflow-hidden bg-slate-50 text-slate-800 flex flex-col antialiased">
  <!-- Root do App React -->
  <div id="root" class="h-full flex flex-col overflow-hidden">
    <!-- Loader inicial -->
    <div class="flex-1 flex flex-col items-center justify-center space-y-4">
      <div class="w-12 h-12 border-4 border-slate-200 border-t-indigo-500 rounded-full animate-spin"></div>
      <p class="text-slate-500 font-medium animate-pulse">Carregando interface do Gerador...</p>
    </div>
  </div>

  <!-- Aba Empresas (Empresa 360º) -->
  <script type="text/babel" src="/empresas.js?v=1.4"></script>

  <!-- Script principal do App React com Babel e versão 53.1 -->
  <script type="text/babel" src="/app.js?v=54.6"></script>
</body>
</html>
