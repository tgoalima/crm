<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Propostas Comerciais - Suprimática</title>
  
  <!-- Estilos de Produção (Tailwind v4 + Custom CSS compilados) -->
  <link rel="stylesheet" href="/dist/styles.css?v=28.0">

  <!-- Supabase JS Client CDN (versão pinada — a mesma que já estava sendo
       servida via @2 antes, só travada pra não quebrar numa atualização
       silenciosa do CDN) -->
  <script defer crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>

  <!-- React & ReactDOM CDN -->
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Chart.js CDN (versão pinada, mesmo motivo do Supabase acima) -->
  <script defer crossorigin src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body class="h-screen overflow-hidden bg-slate-50 text-slate-800 flex flex-col antialiased">
  <!-- Root do App React -->
  <div id="root" class="h-full flex flex-col overflow-hidden">
    <!-- Loader inicial -->
    <div class="flex-1 flex flex-col items-center justify-center space-y-4">
      <div class="w-12 h-12 border-4 border-slate-200 border-t-indigo-500 rounded-full animate-spin"></div>
      <p class="text-slate-500 font-medium animate-pulse">Carregando interface do Gerador...</p>
    </div>
  </div>

  <!-- Módulos adicionais do App React — compilados via esbuild (npm run build),
       não mais transpilados no navegador via Babel Standalone (removido:
       eliminava ~2-3MB de download + parse/transpile de ~12 mil linhas de
       JSX a cada carregamento, pra todo usuário). `defer` preserva a ordem
       de execução dos scripts abaixo, incluindo os CDN acima. -->
  <script defer src="/dist/empresas.js?v=5.2"></script>
  <script defer src="/dist/app.js?v=58.6"></script>
</body>
</html>
