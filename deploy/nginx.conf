# Rate limit básico nos proxies pra ClickUp/Edge Functions — não existia
# proteção nenhuma antes contra um loop de cliente descontrolado (a chave
# anon do Supabase e o proxy ClickUp são ambos publicamente acessíveis).
# 60r/m = 1 req/s em média por IP, com folga de burst=20 pra ações legítimas
# que disparam várias chamadas de uma vez (ex: abrir o drawer de um negócio).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# Zona própria pro upload de anexos (Fase 4) — bem mais restritiva que a
# api_limit: upload é ação pontual (anexar um print/PDF numa atividade), não
# um fluxo que dispara várias chamadas seguidas como abrir um drawer.
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # Sem isso, nada tinha Cache-Control explícito e o navegador (ou o
        # iframe do ClickUp, onde o CRM roda embutido) podia servir o
        # index.html antigo do cache heurístico num "recarregar" comum, sem
        # nem revalidar com o servidor — foi o que aconteceu no deploy do
        # dark mode (usuário recarregou e nada mudou). no-cache != no-store:
        # ainda cacheia, mas sempre revalida (If-None-Match/304) antes de usar.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets versionados (?v=X.Y no index.html, bumpado a cada deploy) podem
    # cachear por muito tempo com segurança — o cache-busting já é a URL
    # mudar, não o tempo de expiração.
    location /dist/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Configuração de endpoints Supabase
    location = /api/config {
        default_type application/json;
        return 200 '{"SUPABASE_URL":"https://supabase.llworkflow.com.br","SUPABASE_ANON_KEY":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgzNTMyMjQ5LCJleHAiOjIwOTg4OTIyNDl9.DYJrIfSr6jdrn-xhmc9q_wGtfdRUYrYwP2UvkpvGLl0"}';
    }

    # Proxy para API do ClickUp: repassa o token pessoal do vendedor recebido no header Authorization
    location ~ ^/clickup-api/(.*)$ {
        limit_req zone=api_limit burst=20 nodelay;
        resolver 8.8.8.8 valid=30s;
        proxy_ssl_server_name on;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type "application/json";
        proxy_pass https://api.clickup.com/api/v2/$1$is_args$args;
    }

    # Proxy para upload de anexos direto pra API do ClickUp (Fase 4 — anexos
    # nas Atividades). Diferente do /clickup-api acima: aqui NÃO sobrescreve
    # o Content-Type — o upload é multipart/form-data com um boundary que
    # muda a cada requisição, e forçar "application/json" quebraria o corpo
    # inteiro. client_max_body_size só nesta location (as demais seguem no
    # 1MB padrão do nginx, de propósito — corpo de atividade/tarefa é texto).
    location ~ ^/clickup-upload/(.*)$ {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 30m;
        resolver 8.8.8.8 valid=30s;
        proxy_ssl_server_name on;
        proxy_set_header Authorization $http_authorization;
        proxy_pass https://api.clickup.com/api/v2/$1$is_args$args;
    }

    # Proxy para as Edge Functions que substituem /api/tarefas e /api/atividades
    # de server.py (que só roda localmente, não na VPS). Repassa o token
    # pessoal do vendedor recebido no header Authorization, igual ao
    # /clickup-api acima. O roteador interno das Edge Functions preserva o
    # segmento do nome da function no path — por isso o proxy_pass mantém
    # "api-tarefas"/"api-atividades" no destino em vez de removê-lo.
    location ~ ^/api/tarefas(.*)$ {
        limit_req zone=api_limit burst=20 nodelay;
        resolver 8.8.8.8 valid=30s;
        proxy_ssl_server_name on;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type "application/json";
        proxy_pass https://supabase.llworkflow.com.br/functions/v1/api-tarefas$1$is_args$args;
    }

    location ~ ^/api/atividades(.*)$ {
        limit_req zone=api_limit burst=20 nodelay;
        resolver 8.8.8.8 valid=30s;
        proxy_ssl_server_name on;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type "application/json";
        proxy_pass https://supabase.llworkflow.com.br/functions/v1/api-atividades$1$is_args$args;
    }

    # Health-check público (sem auth — FUNCTIONS_VERIFY_JWT=false neste stack)
    # pra monitoramento externo (UptimeRobot etc.) checar banco + ClickUp.
    location = /health {
        resolver 8.8.8.8 valid=30s;
        proxy_ssl_server_name on;
        proxy_pass https://supabase.llworkflow.com.br/functions/v1/health-check;
    }
}