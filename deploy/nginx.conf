server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ATENÇÃO: nginx não lê variáveis de ambiente de arquivo .env nativamente.
    # Se este proxy ainda for usado, gere este arquivo a partir de um template
    # (ex.: nginx.conf.template + `envsubst` no entrypoint do container) e
    # injete o token via variável de ambiente do Docker/CI, nunca em texto puro.
    location ~ ^/clickup-api/(.*)$ {
        resolver 8.8.8.8 valid=30s;
        proxy_ssl_server_name on;
        proxy_set_header Authorization "${CLICKUP_TOKEN}";
        proxy_set_header Content-Type "application/json";
        proxy_pass https://api.clickup.com/api/v2/$1$is_args$args;
    }
}