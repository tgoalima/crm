server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para API do ClickUp: repassa o token pessoal do usuário se enviado pelo frontend,
    # caso contrário faz fallback para a variável de ambiente CLICKUP_TOKEN.
    location ~ ^/clickup-api/(.*)$ {
        resolver 8.8.8.8 valid=30s;
        proxy_ssl_server_name on;

        set $auth_header $http_authorization;
        if ($auth_header = "") {
            set $auth_header "${CLICKUP_TOKEN}";
        }

        proxy_set_header Authorization $auth_header;
        proxy_set_header Content-Type "application/json";
        proxy_pass https://api.clickup.com/api/v2/$1$is_args$args;
    }
}